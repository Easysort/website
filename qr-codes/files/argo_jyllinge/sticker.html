<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>A4 QR – easysort.org/argo/jyllinge</title>
<style>
    @page { size: 216mm 303mm; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 216mm; height: 303mm; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        color: #111111;
        background: #fff;
        -webkit-font-smoothing: antialiased;
    }
    .page {
        width: 216mm;
        height: 303mm;
        /* 3 mm bleed + 6 mm from the finished edge to the frame. */
        padding: 9mm;
    }
    .frame {
        width: 100%;
        height: 100%;
        border: 2.2mm solid #16a34a;
        border-radius: 6mm;
        padding: 32mm 24.3mm 10mm;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }
    h1 {
        font-size: 12mm;
        font-weight: 800;
        letter-spacing: -0.045em;
        line-height: 1.12;
        width: 145mm;
    }
    .qr {
        width: 145mm;
        height: 145mm;
        margin: 9mm 0 10mm;
        display: block;
        object-fit: fill;
    }
    .how {
        font-size: 7mm;
        font-weight: 500;
        line-height: 1.3;
        color: #3f3f46;
        width: 145mm;
    }
    .url {
        margin-top: 12mm;
        font-size: 5.8mm;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #15803d;
        width: 145mm;
    }
    .brand {
        margin-top: auto;
        font-size: 4mm;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #a1a1aa;
    }
</style>
</head>
<body>
<div class="page">
    <div class="frame">
        <h1>Tag billede af dit affald<br>og få den rigtige container.</h1>
        <img class="qr" src="qr.svg" alt="QR-kode til sorteringsguiden">
        <p class="how">Scan koden og tag et billede af dit affald,<br>så viser guiden den rigtige container.</p>
        <p class="url">easysort.org/argo/jyllinge</p>
        <p class="brand">Argo · Easysort</p>
    </div>
</div>
</body>
</html>
