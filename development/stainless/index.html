<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Stainless steel detection | Easysort</title>
    <link rel="stylesheet" href="../../style2.css?v=20260816">

    <style>
        .stainless-video {

        <div class="social-links">

        <section class="vision-hero">

            <h1 class="vision-title">Stainless steel detection</h1>

        <section class="vision-metric" style="display:block">
            <video class="stainless-video" src="stainless-detection.mp4" poster="poster.jpg" controls autoplay muted loop playsinline preload="metadata"></video>
